<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer - Productivity App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🍅</text></svg>">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🍅 Pomodoro Timer</h1>
            <p class="subtitle">Boost Your Productivity with Focused Work Sessions</p>
        </header>

        <div class="timer-display">
            <div class="time" id="timerDisplay">25:00</div>
            <div class="session-label" id="sessionLabel">Work Session</div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">▶ Start</button>
            <button id="pauseBtn" class="btn btn-secondary" disabled>⏸ Pause</button>
            <button id="resetBtn" class="btn btn-danger">↻ Reset</button>
        </div>

        <div class="settings">
            <h3 class="settings-title">⚙️ Settings</h3>
            <div class="setting-group">
                <label for="workDuration">Work Duration (min):</label>
                <div class="input-group">
                    <input type="number" id="workDuration" min="1" max="60" value="25">
                    <span class="input-suffix">min</span>
                </div>
            </div>
            <div class="setting-group">
                <label for="breakDuration">Break Duration (min):</label>
                <div class="input-group">
                    <input type="number" id="breakDuration" min="1" max="30" value="5">
                    <span class="input-suffix">min</span>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-icon">📅</div>
                <h3>Today's Cycles</h3>
                <div class="stat-number" id="todayCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon">🏆</div>
                <h3>Total Cycles</h3>
                <div class="stat-number" id="totalCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon">📆</div>
                <h3>Current Date</h3>
                <div class="stat-date" id="currentDate">--/--/--</div>
            </div>
        </div>

        <div class="history-section">
            <h3 class="history-title">📊 History</h3>
            <div id="historyContainer" class="history-container">
                <p class="no-history">No history yet. Start your first session!</p>
            </div>
        </div>

        <div class="footer-buttons">
            <button id="clearDataBtn" class="btn btn-clear">🗑️ Clear All Data</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
